name: Update README cards

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require GH_PAT for accurate private stats
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "Skip: set repo secret GH_PAT (classic PAT with read:user) to refresh overview SVG."
            exit 0
          fi
          echo "HAS_PAT=1" >> "$GITHUB_ENV"

      - name: Generate overview SVGs
        if: env.HAS_PAT == '1'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_ACTOR: ${{ github.repository_owner }}
        run: node scripts/generate-overview.mjs

      - name: Commit cards
        if: env.HAS_PAT == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/metrics.svg profile/metrics-dark.svg profile/languages.svg profile/languages-dark.svg profile/github-overview.svg profile/github-overview-dark.svg
          git commit -m "chore(profile): update metrics and languages cards" || exit 0
          git push
